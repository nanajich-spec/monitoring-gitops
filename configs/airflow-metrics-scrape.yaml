apiVersion: v1
kind: Service
metadata:
  name: airflow-statsd-metrics
  namespace: airflow
  labels:
    app: airflow-statsd
    component: metrics
spec:
  selector:
    component: statsd
    release: airflow
  ports:
  - name: metrics
    port: 9102
    targetPort: 9102
    protocol: TCP
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airflow-metrics
  namespace: airflow
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      component: metrics
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
