apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-teams-template
  namespace: monitoring
data:
  teams.tmpl: |
    {{ define "teams.card" }}
    {
      "@type": "MessageCard",
      "@context": "https://schema.org/extensions",
      "summary": "{{ .CommonAnnotations.summary }}",
      "themeColor": "{{ if eq .Status "firing" }}d63333{{ else }}2dc72d{{ end }}",
      "title": "{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}",
      "sections": [
        {
          "activityTitle": "Alert Details",
          "facts": [
            {{- range .Alerts }}
            {
              "name": "Alert",
              "value": "{{ .Labels.alertname }}"
            },
            {
              "name": "Severity",
              "value": "{{ .Labels.severity }}"
            },
            {{- if .Labels.namespace }}
            {
              "name": "Namespace",
              "value": "{{ .Labels.namespace }}"
            },
            {{- end }}
            {{- if .Labels.pod }}
            {
              "name": "Pod",
              "value": "{{ .Labels.pod }}"
            },
            {{- end }}
            {
              "name": "Description",
              "value": "{{ .Annotations.description }}"
            },
            {
              "name": "Status",
              "value": "{{ .Status }}"
            },
            {
              "name": "Started At",
              "value": "{{ .StartsAt.Format \"2006-01-02 15:04:05\" }}"
            }
            {{- end }}
          ]
        }
      ],
      "potentialAction": [
        {
          "@type": "OpenUri",
          "name": "View in Prometheus",
          "targets": [
            {
              "os": "default",
              "uri": "http://172.28.229.33:30090/alerts"
            }
          ]
        }
      ]
    }
    {{ end }}
