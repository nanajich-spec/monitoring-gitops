apiVersion: v1
kind: ConfigMap
metadata:
  name: resource-limit-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
data:
  resource-alerts.yaml: |
    groups:
    - name: resource_limits
      interval: 30s
      rules:
      # CPU Alerts
      - alert: HighCPUUsage
        expr: |
          (sum(rate(container_cpu_usage_seconds_total{namespace!=""}[5m])) by (namespace, pod) 
          / sum(kube_pod_container_resource_limits{resource="cpu", namespace!=""}) by (namespace, pod)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "High CPU usage detected"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value }}% of CPU limit"
      
      - alert: CriticalCPUUsage
        expr: |
          (sum(rate(container_cpu_usage_seconds_total{namespace!=""}[5m])) by (namespace, pod) 
          / sum(kube_pod_container_resource_limits{resource="cpu", namespace!=""}) by (namespace, pod)) * 100 > 90
        for: 2m
        labels:
          severity: critical
          component: kubernetes
        annotations:
          summary: "Critical CPU usage detected"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value }}% of CPU limit - immediate action required"
      
      # Memory Alerts
      - alert: HighMemoryUsage
        expr: |
          (sum(container_memory_working_set_bytes{namespace!=""}) by (namespace, pod) 
          / sum(kube_pod_container_resource_limits{resource="memory", namespace!=""}) by (namespace, pod)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "High memory usage detected"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value }}% of memory limit"
      
      - alert: CriticalMemoryUsage
        expr: |
          (sum(container_memory_working_set_bytes{namespace!=""}) by (namespace, pod) 
          / sum(kube_pod_container_resource_limits{resource="memory", namespace!=""}) by (namespace, pod)) * 100 > 90
        for: 2m
        labels:
          severity: critical
          component: kubernetes
        annotations:
          summary: "Critical memory usage detected"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value }}% of memory limit - OOM kill risk"
      
      # Storage Alerts
      - alert: HighStorageUsage
        expr: |
          (sum(kubelet_volume_stats_used_bytes) by (namespace, persistentvolumeclaim) 
          / sum(kubelet_volume_stats_capacity_bytes) by (namespace, persistentvolumeclaim)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "High storage usage detected"
          description: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ $value }}% full"
      
      - alert: CriticalStorageUsage
        expr: |
          (sum(kubelet_volume_stats_used_bytes) by (namespace, persistentvolumeclaim) 
          / sum(kubelet_volume_stats_capacity_bytes) by (namespace, persistentvolumeclaim)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "Critical storage usage detected"
          description: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ $value }}% full - expansion required"
      
      # Airflow Specific Alerts
      - alert: AirflowPodDown
        expr: kube_pod_status_phase{namespace="airflow", phase!="Running"} == 1
        for: 5m
        labels:
          severity: critical
          component: airflow
        annotations:
          summary: "Airflow pod is down"
          description: "Pod {{ $labels.pod }} in Airflow namespace is in {{ $labels.phase }} state"
      
      - alert: AirflowPodRestarting
        expr: rate(kube_pod_container_status_restarts_total{namespace="airflow"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: airflow
        annotations:
          summary: "Airflow pod is restarting"
          description: "Pod {{ $labels.pod }} in Airflow namespace has restarted {{ $value }} times in the last 15 minutes"
      
      - alert: AirflowSchedulerDown
        expr: absent(kube_pod_status_phase{namespace="airflow", pod=~".*scheduler.*", phase="Running"})
        for: 2m
        labels:
          severity: critical
          component: airflow
        annotations:
          summary: "Airflow Scheduler is down"
          description: "Airflow Scheduler pod is not running - DAG execution will stop"
      
      - alert: AirflowWebserverDown
        expr: absent(kube_pod_status_phase{namespace="airflow", pod=~".*webserver.*", phase="Running"})
        for: 5m
        labels:
          severity: warning
          component: airflow
        annotations:
          summary: "Airflow Webserver is down"
          description: "Airflow Webserver pod is not running - UI is unavailable"
      
      # General Kubernetes Alerts
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod is crash looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash looping"
      
      - alert: PersistentVolumeClaimPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "PVC is pending"
          description: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} has been pending for more than 10 minutes"
